includes:
  - "docs-src/**/*.vasm.md"
  - "skills-src/**/*.vasm.md"

excludes:
  - "docs-src/fragments/**/*.vasm.md"

output:
  dir: "."
  flat: false
  inPlace: false

baseDir: "docs-src"

compile:
  informational:
    targetLangs: ["en", "zh-CN"]
  executable:
    targetLangs: ["zh-CN"]

security:
  mode: review

catalog:
  outDir: "./vasm-catalog"
  exports:
    editor:
      source: "skills-src/editor.vasm.md"
      targetLang: "zh-CN"
      file: "math-workspace-editor.zh-CN.md"
    integrator:
      source: "skills-src/integrator.vasm.md"
      file: "math-workspace-integrator.md"
    lean-formalization:
      source: "skills-src/lean-formalization.vasm.md"
      targetLang: "zh-CN"
      file: "math-workspace-lean-formalization.zh-CN.md"

ai:
  projectReview:
    mode: suggest
    include:
      - "README.md"
      - "docs/**/*.md"
      - "skills/**/*.md"
      - "vasm-catalog/**/*.md"
      - "vasm-catalog/**/*.yaml"
      - "docs-src/**/*.vasm.md"
      - "skills-src/**/*.vasm.md"

routing:
  - match: "docs-src/README.vasm.md"
    dest: "./README.md"
  - match: "docs-src/docs/*.vasm.md"
    dest: "./docs/"
  - match: "skills-src/*.vasm.md"
    dest: "./skills/"
