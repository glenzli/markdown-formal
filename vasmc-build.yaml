includes:
  - "docs-src/**/*.vasm.md"
  - "skills-src/**/*.vasm.md"

excludes:
  - "docs-src/fragments/**/*.vasm.md"

output:
  dir: "."
  flat: false
  inPlace: false

baseDir: "docs-src"

compile:
  informational:
    targetLangs: ["en", "zh-CN"]
  executable:
    targetLangs: ["zh-CN"]
  integrative:
    targetLangs: ["zh-CN"]

security:
  mode: review

ai:
  projectReview:
    mode: suggest
    include:
      - "README.md"
      - "docs/**/*.md"
      - "skills/**/*.md"
      - "docs-src/**/*.vasm.md"
      - "skills-src/**/*.vasm.md"

routing:
  - match: "docs-src/README.vasm.md"
    dest: "./README.md"
  - match: "docs-src/docs/*.vasm.md"
    dest: "./docs/"
  - match: "skills-src/*.vasm.md"
    dest: "./skills/"
